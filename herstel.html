<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Joey's WorpenWijzer PRO</title><style>body{font:16px system-ui;margin:0;background:#f7f7f7;color:#191919;display:grid;place-items:center;min-height:100vh}.card{background:white;padding:28px;max-width:530px;border-radius:18px;box-shadow:0 7px 24px #0001}button{padding:13px 19px;background:#171717;color:white;border:0;border-radius:9px;font:inherit;cursor:pointer}p{line-height:1.6}</style></head><body><main class="card"><h1>🥋 Joey's WorpenWijzer PRO</h1><p>Deze pagina verwijdert de verouderde offline-appcache. Je opgeslagen oefenvoortgang in localStorage blijft behouden.</p><button id="go">Cache opschonen en app openen</button><p id="msg" aria-live="polite"></p></main><script>document.getElementById('go').addEventListener('click',async()=>{const msg=document.getElementById('msg');msg.textContent='Cache wordt opgeschoond…';try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const reg of regs)if(reg.scope.includes('/WorpenWijzer/'))await reg.unregister()}if('caches' in window){const names=await caches.keys();for(const name of names)await caches.delete(name)}msg.textContent='Opgeschoond. De app wordt geopend.'}catch(e){msg.textContent='Opschonen niet volledig gelukt, app wordt toch geopend.'}location.replace('./controle-69.html?herstel=20261125c')});</script></body></html>
